<!doctype html>
<html lang="en">
<!-- revontuli · about: another chapter of the same book — the almanac paper, in two inks from the flower wallpaper (peach & navy) -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About — Vlad Loktev</title>
<meta name="description" content="About Dr. Vladislav Loktev, astrophysicist: current position, personal info, career path, and contact info how to get in touch.">
<link rel="icon" href="assets/images/favicon/hedgehog.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="assets/images/favicon/hedgehog-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/images/favicon/hedgehog-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
/* the same paper as Research; the inks are the wallpaper's: a dark blue-charcoal and a pale dusty peach */
:root{
  --ink:#2B3142; --ink-2:#555C6E; --ink-3:#878C99; --hair:rgba(43,49,66,.5); --faint:rgba(43,49,66,.14);
  --rubric:#2B3142; --peach:#E7C4A6; --peach-2:#D8A984; --peach-3:#F3DDC9;
}
a{text-decoration-color:var(--peach-2);text-decoration-thickness:2px;text-underline-offset:.18em}
a:hover{color:var(--ink);text-decoration-color:var(--ink)}
.rh-nav a .n{color:var(--peach-2)}
.rh-nav a[aria-current="true"]{box-shadow:inset 0 -2px 0 var(--peach-2)}
::selection{background:var(--peach);color:var(--ink)}

/* chapter I: the prose, with the portrait standing beside it */
section.ch#about{padding-top:57.6px}
.about-body{display:grid;grid-template-columns:minmax(0,36em) 252px;grid-template-areas:"prose fig";gap:25.2px 57.6px;justify-content:space-between;align-items:start}
.about-body .prose{grid-area:prose}
.front{grid-area:fig;margin:5.4px 0 0;justify-self:end;width:100%;max-width:252px}
.front .plate{position:relative;background:var(--peach-3);padding:10.8px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 14.4px 27px -21.6px rgba(30,30,50,.55)}
.front .plate::before{content:"";position:absolute;inset:5.4px;border:1px solid var(--hair);pointer-events:none}
.front canvas{display:block;width:100%;
  aspect-ratio:640/640;
  background:var(--peach)}
.front img{display:block;width:100%;
  aspect-ratio:640/640;
  object-fit:cover;object-position:50% 20%;filter:grayscale(1) sepia(.3) hue-rotate(180deg) contrast(.95)}
.front figcaption{margin-top:10.8px;text-align:center;font-family:var(--sc);font-weight:600;font-size:14.4px;letter-spacing:.14em;color:var(--ink)}
@media (max-width:810px){.about-body{grid-template-columns:minmax(0,1fr);grid-template-areas:"fig" "prose"}.front{justify-self:start;max-width:207px;margin:0 0 5.4px}}

/* the prose: flowing paragraphs, as the old page had them */
.prose{max-width:36em}
.prose p{margin:0 0 .9em}
.prose p:first-child{font-size:1.12em;line-height:1.45}
.prose p:first-child::first-letter{float:left;font-size:3.5em;line-height:.8;padding:.08em .1em .02em .06em;margin:.04em .12em 0 0;background:var(--peach);color:var(--ink);font-weight:600}

/* the route so far (after pikeperch): places, years, one line each, with their links */
.route{list-style:none;margin:0;padding:0 0 0 2px;max-width:40em;position:relative}
.route li{position:relative;padding:0 0 16.2px 27px;border-left:1.5px dotted var(--hair)}
.route li:last-child{border-left-color:transparent;padding-bottom:0}
.route li::before{content:"";position:absolute;left:-6.8px;top:.42em;width:11.7px;height:11.7px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.route li.now::before{background:var(--peach);border-color:var(--ink)}
.route b{font-weight:600;font-size:1.08em}
.route .yr{font-family:var(--sc);font-size:12.6px;letter-spacing:.1em;color:var(--ink-2);margin-left:.5em;white-space:nowrap}
.route p{margin:.1em 0 0;color:var(--ink-2);font-size:.92em;line-height:1.42}
/* …and beside it, off the clock: a second plate, engraved like the frontispiece */
.route-body{display:grid;grid-template-columns:minmax(0,40em) 270px;gap:25.2px 57.6px;justify-content:space-between;align-items:start}
.offduty{margin:3.6px 0 0;justify-self:end;width:100%;max-width:270px}
.offduty .plate{position:relative;background:var(--peach-3);padding:10.8px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 14.4px 27px -21.6px rgba(30,30,50,.55)}
.offduty .plate::before{content:"";position:absolute;inset:5.4px;border:1px solid var(--hair);pointer-events:none}
.offduty .pic{position:relative;aspect-ratio:4/5;background:var(--peach)}
.offduty canvas,.offduty img{display:block;position:absolute;inset:0;width:100%;height:100%}
.offduty img{object-fit:cover;object-position:60% 50%;filter:grayscale(1) sepia(.3) hue-rotate(180deg) contrast(.95)}
.offduty figcaption{margin-top:10.8px;text-align:center;font-family:var(--sc);font-weight:600;font-size:14.4px;letter-spacing:.14em;color:var(--ink)}
.offduty figcaption small{display:block;margin-top:2px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:13.5px;letter-spacing:0;color:var(--ink-2)}
@media (max-width:810px){.route-body{grid-template-columns:minmax(0,1fr)}.offduty{justify-self:start;max-width:234px}}

/* contact: the tear-off tabs are the only list of addresses on the page */
.contact .lede{max-width:36em;margin:0 0 .3em}
.contact .office{margin:0;color:var(--ink-2);font-size:.92em}
.contact .office a{white-space:nowrap}
.notice{position:relative;margin:23.4px 0 0;max-width:738px;background:var(--peach-3);padding:14.4px 0 0;box-shadow:0 1px 0 rgba(0,0,0,.03),0 16.2px 27px -23.4px rgba(30,30,50,.6)}
.notice-h{margin:0 16.2px 12.6px;display:flex;justify-content:space-between;align-items:baseline;gap:10.8px;flex-wrap:wrap}
.notice-h b{font-family:var(--sc);font-weight:700;font-size:18px;letter-spacing:.14em}
.notice-h span{font-style:italic;color:var(--ink-2);font-size:14.4px}
.tabs{list-style:none;margin:0;padding:0;display:flex;border-top:1.5px dashed var(--ink);min-height:262.8px}
.tabs li{flex:1 1 0;min-width:0;position:relative;border-right:1.5px dashed var(--ink)}
.tabs li:last-child{border-right:0}
.tab{position:absolute;left:0;right:0;top:0;height:262.8px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);background:var(--peach-3);transform-origin:50% 0;-webkit-tap-highlight-color:transparent}
.tab .v{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:15.3px;letter-spacing:.01em;white-space:nowrap}
.tab .v small{display:block;font-family:var(--sc);font-size:11.7px;font-weight:600;letter-spacing:.16em;color:var(--ink-2);margin-left:3.6px}
.tab:hover{background:#F7E6D6}
.tab:hover .v .addr,.tab:hover .v .t{text-decoration:underline;text-decoration-color:var(--peach-2);text-decoration-thickness:2px}
.tab.torn{animation:tear 1.1s cubic-bezier(.4,.1,.7,1) forwards;pointer-events:none}
@keyframes tear{0%{transform:none}25%{transform:rotate(-7deg) translateY(3.6px)}100%{transform:rotate(-24deg) translate(-36px,378px);opacity:0}}
.tab.regrow{animation:regrow .6s ease-out}
@keyframes regrow{from{opacity:0;transform:translateY(-10.8px)}to{opacity:1;transform:none}}
/* stubs of tabs someone already tore off and took: no link, no pull — only what's left above the tear */
.tabs li.gone{background:var(--paper) var(--laid)}
.stub{position:absolute;left:0;right:0;top:0;font-size:15.3px;height:calc(var(--n,16) * .5em + 2.4em + var(--x,0px));display:flex;align-items:flex-end;justify-content:center;padding-bottom:5.4px;
  background:linear-gradient(170deg,#EFD9C4,#E6CDB6 60%,#EAD3BF);color:var(--ink-3);filter:saturate(.85);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 5.4px),86% 100%,72% calc(100% - 7.2px),58% calc(100% - 1px),44% calc(100% - 8.1px),30% calc(100% - 2px),16% calc(100% - 6.3px),0 calc(100% - 2.7px))}
.stub::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 55%),linear-gradient(0deg,rgba(43,49,66,.08),transparent 30%);pointer-events:none}
.stub .v{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;white-space:nowrap;color:var(--ink-2);opacity:.9;letter-spacing:.01em}
html.rv-reduced .tab.torn{animation:none;opacity:.3}
@media (prefers-reduced-motion:reduce){.tab.torn{animation:none;opacity:.3}}
@media (max-width:576px){.tabs{flex-wrap:wrap;border-top:0;min-height:0}.tabs li{flex:0 0 20%;height:252px;border-top:1.5px dashed var(--ink)}.tabs li:nth-child(5n){border-right:0}.tabs li:nth-child(n+6){margin-top:12.6px}.tab{height:252px}.tab .v,.stub{font-size:13.1px}.tab .v small{font-size:10.3px;letter-spacing:.1em}.notice-h b{font-size:15.3px}}
.tabs-note{margin:9px 0 0;font-style:italic;color:var(--ink-2);font-size:14.4px}

/* under the tabs: the CV, and the legacy $50 (kept for the connoisseurs) — a matched pair of buttons */
.acts{display:flex;flex-wrap:wrap;gap:12.6px;margin:21.6px 0 0}
.act{display:inline-flex;align-items:center;justify-content:center;min-width:9.5em;font:inherit;font-family:var(--sc);font-weight:700;letter-spacing:.08em;font-size:13.5px;line-height:1.2;color:var(--ink);background:var(--peach);border:1px solid var(--ink);border-radius:2px;padding:5.4px 14.4px 6.3px;cursor:pointer;text-decoration:none;box-shadow:2px 2px 0 var(--ink)}
.act:hover{background:#EDCFB5;color:var(--ink)}
.act:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.act:focus-visible{outline:2px solid var(--ink);outline-offset:2.7px}
dialog.err{border:0;padding:10.8px;width:min(504px,calc(100vw - 28.8px));background:#f9dee4;border-radius:5.4px;box-shadow:0 27px 54px -18px rgba(20,20,40,.55),0 0 0 1px rgba(43,49,66,.2);color:#1e2439}
dialog.err::backdrop{background:rgba(30,32,48,.35)}
.err-img{position:relative;aspect-ratio:16/9;background:#3b4150 url(assets/images/wha.png) center/cover no-repeat;border-radius:2.7px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:16.2px 18px}
.err-msg{margin:0;max-width:17em;font-family:var(--serif);font-size:clamp(18px,3.2vw,24.3px);line-height:1.22;font-weight:600;color:#d5e083;text-shadow:0 2px 5.4px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4)}
.err-t{margin:0 0 5.4px;font-family:var(--sc);font-size:11.7px;letter-spacing:.2em;color:#d5e083;opacity:.85;text-shadow:0 1px 2.7px rgba(0,0,0,.6)}
.err-b{align-self:flex-end;font-family:var(--sc);font-weight:700;letter-spacing:.1em;font-size:13.5px;background:#1e2439;color:#95d5b7;border:0;border-radius:2.7px;padding:6.3px 14.4px 7.2px;cursor:pointer;box-shadow:0 5.4px 12.6px -5.4px rgba(0,0,0,.6)}
.err-b:hover{background:#2a3150}
.err-b:focus-visible{outline:2px solid #95d5b7;outline-offset:2px}
</style>

<script>
/* revontuli · about. Prose, route and tabs from data.js; the frontispiece engraved with the research page's burin. */
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const md = SITE.md, esc = RV.esc;

/* ---------- the text ---------- */
$('#prose').innerHTML = SITE.about.map(p => `<p>${md(p)}</p>`).join('');
$('#routeList').innerHTML = SITE.path.map(p => `<li${p.now ? ' class="now"' : ''}><b>${esc(p.city || p.place)}</b><span class="yr">${esc(p.short || p.when)}</span><p>${md(p.brief || p.text)}</p></li>`).join('');
$('#office').textContent = SITE.OFFICE;

/* ---------- the tear-off tabs, with the stubs of the ones already taken ---------- */
const live = SITE.contacts.map(c => c.user
  ? `<li><a class="tab" data-u="${esc(c.user)}" data-d="${esc(c.domain)}" href="#contact"><span class="v"><small>${esc(c.label)}</small><span class="addr"></span></span></a></li>`
  : `<li><a class="tab" href="${esc(c.url)}" target="_blank" rel="noopener"><span class="v"><small>${esc(c.label)}</small><span class="t">${esc(c.text)}</span></span></a></li>`);
const stubs = SITE.torn.map((s, k) => ({ after: s.after, html: `<li class="gone" aria-hidden="true"><span class="stub" style="--n:${[...s.text].length};--x:${[14, 0, 22, 6][k % 4]}px"><span class="v">${esc(s.text)}</span></span></li>` }));
const out = []; live.forEach((h, i) => { out.push(h); stubs.filter(s => s.after === i).forEach(s => out.push(s.html)); });
stubs.filter(s => s.after >= live.length || s.after < 0).forEach(s => out.push(s.html));
$('#tabs').innerHTML = out.join('');
RV.mails($('#tabs'));
$$('.tab').forEach(a => a.addEventListener('click', e => {
  if (a.classList.contains('torn')) { e.preventDefault(); return; }
  const href = a.href, ext = a.target === '_blank';
  a.classList.add('torn');
  if (!ext && !RV.reduced()) { e.preventDefault(); setTimeout(() => { location.href = href; }, 380); }
  setTimeout(() => { a.classList.remove('torn'); a.classList.add('regrow'); setTimeout(() => a.classList.remove('regrow'), 700); }, 4200);
}));
RV.register('tear', () => { const a = $$('.tab').find(x => !x.classList.contains('torn')); if (!a) return ['no tabs left. give them a few seconds to grow back.']; a.scrollIntoView({ block: 'center' }); a.click(); return ['rrrip.']; }, { hidden: true });

/* ---------- the legacy $50 ---------- */
const dlg = $('#err');
$('#get50').addEventListener('click', () => { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); });
$('#errOk').addEventListener('click', () => { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ---------- the frontispiece: the photo, re-engraved in ink-blue on a peach plate ----------
   The still is frame 01 of the nod sequence; the nod stays off until the photo is replaced. */
// const PORTRAIT = 'assets/images/alive_2/frame01.jpg';
const PORTRAIT = 'assets/images/madheadshot.jpeg';
const cv = $('#por');
let PIX = null;
function load() { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = PORTRAIT; }); }
function engravePortrait() {
  if (!PIX) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1), w = Math.round(r.width * dpr), h = Math.round(r.height * dpr); if (w < 20) return;
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d'), img = c.createImageData(w, h), d = img.data, P = 2.6 * dpr, aa = P / 2.1;
  const ink = [43, 49, 66], bg = [231, 196, 166];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const u = x / w, v = y / h, sx = Math.min(PIX.w - 1, u * PIX.w | 0), sy = Math.min(PIX.h - 1, (0.02 + v * 0.93) * PIX.h | 0);
    const l = PIX.L[sy * PIX.w + sx], dk = 1 - l, i = (y * w + x) * 4;
    // lines follow the form a little (bent by the tone), cross-hatching in the shadows
    const p = (y + 5 * dpr * Math.sin(x / (38 * dpr)) + 7 * dpr * l) / P, q = (x * 0.72 + y * 0.7) / P;
    let a = 0;
    if (dk > 0.03) { const wid = Math.min(1, Math.pow(dk, 0.92) * 1.06), f1 = p - Math.floor(p), t1 = Math.abs(f1 - 0.5) * 2; let c1 = clamp((wid - t1) * aa + 0.5); let c2 = 0; if (dk > 0.58) { const w2 = Math.min(0.85, (dk - 0.58) / 0.42 * 0.9), f2 = q - Math.floor(q); c2 = clamp((w2 - Math.abs(f2 - 0.5) * 2) * aa + 0.5); } a = Math.max(c1, c2); }
    const edge = Math.min(1, u / 0.04, (1 - u) / 0.04, v / 0.03, (1 - v) / 0.03);        // a soft vignette at the plate's edge
    a *= clamp(edge);
    d[i] = bg[0] + (ink[0] - bg[0]) * a; d[i + 1] = bg[1] + (ink[1] - bg[1]) * a; d[i + 2] = bg[2] + (ink[2] - bg[2]) * a; d[i + 3] = 255;
  }
  c.putImageData(img, 0, 0);
}
(async () => {
  try {
    const im = await load(), w = 224, h = 304, tc = document.createElement('canvas'); tc.width = w; tc.height = h;
    const x = tc.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, w, h);
    const px = x.getImageData(0, 0, w, h).data, L = new Float32Array(w * h), hist = new Uint32Array(256);
    for (let i = 0, k = 0; i < px.length; i += 4, k++) { const l = .299 * px[i] + .587 * px[i + 1] + .114 * px[i + 2]; L[k] = l / 255; hist[l | 0]++; }
    let acc = 0, lo = 0, hi = 255; for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc < w * h * .02) lo = v; if (acc < w * h * .9) hi = v; }
    for (let k = 0; k < L.length; k++) L[k] = Math.pow(clamp((L[k] - lo / 255) / Math.max(.1, (hi - lo) / 255)), 0.9);
    PIX = { w, h, L }; engravePortrait();
  } catch (e) { const im = document.createElement('img'); im.src = PORTRAIT; im.alt = cv.getAttribute('aria-label'); cv.replaceWith(im); }
})();
/* ---------- off the clock: the piano photo, engraved the same way (cover-cropped around a focus point) ---------- */
const PIANO = { src: 'assets/images/piano.jpg', zoom: 0.995, fx: 0.5, fy: 1, tone: 0.8061, local: 1.1, bend: 2 };
// zoom < 1 crops tighter · fx, fy: where the crop sits (0–1) · tone: gamma · local: how much the shadows are lifted against their surroundings · bend: px the lines follow the tone
const pcv = $('#piano');
function engravePiano() {
  const im = PIANO.img; if (!im) return;
