<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Collatz Tree Visualizer</title>
    <meta name="description" content="Grow and explore trees of Collatz-like sequences with your own rules and branch angles.">
    <meta name="color-scheme" content="dark light">
    <script>
        // Theme before first paint: saved choice, else the system setting
        (function () {
            var t = null;
            try { t = localStorage.getItem('ct-theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#panelBody">Skip to controls</a>

<div id="app">
    <aside id="panel" aria-label="Tree controls">
        <header class="panel-head">
            <button id="sheetToggle" class="sheet-toggle" type="button" aria-expanded="false" aria-controls="panelBody" aria-label="Show controls">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 12.5 10 7.5l5 5"/></svg>
            </button>
            <h1 class="app-title">Collatz trees</h1>
            <a href="help.html" class="help-link" target="_blank" rel="noopener">Help</a>
            <div class="head-actions">
                <button id="renderBtn" class="btn btn-primary" type="button" title="Sample new numbers and rebuild (B)">Build trees</button>
                <div class="menu-wrap">
                    <button id="loadTreeBtn" class="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="loadMenu">
                        Load tree <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>
                    </button>
                    <div id="loadMenu" class="popover menu" role="menu" aria-labelledby="loadTreeBtn" hidden>
                        <button type="button" role="menuitem" id="uploadOption">Upload file…</button>
                        <div class="menu-sep" role="separator"></div>
                        <button type="button" role="menuitem" data-file="data/tree-3.json">classic tree</button>
                        <button type="button" role="menuitem" data-file="data/tree-265-rules-n÷2+3_3×n+1.json">with a twist</button>
                        <button type="button" role="menuitem" data-file="data/tree-10-rules-n×3+1_(n+1)÷2+1.json">swap rules</button>
                        <button type="button" role="menuitem" data-file="data/tree-11-rules-n×2+1_(n-1)÷3+1_n×4-1.json">triple chestnut</button>
                        <button type="button" role="menuitem" data-file="data/tree-4.json">triple plane</button>
                        <button type="button" role="menuitem" data-file="data/tree-25.json">quadruple oak</button>
                        <button type="button" role="menuitem" data-file="data/tree-5-rules-(n÷2)-1_(3×n)+1_(n÷2)+1_(3×n)+1.json">quadruple maple</button>
                        <button type="button" role="menuitem" data-file="data/tree-55_complex5bush.json">quintic bush</button>
                    </div>
                </div>
            </div>
        </header>

        <div id="panelBody" class="panel-body" tabindex="-1">
            <section class="group" aria-labelledby="hSample">
                <h2 id="hSample">Sample</h2>
                <div class="row3">
                    <div class="field">
                        <label for="sampleSize">Samples</label>
                        <input type="number" id="sampleSize" value="500" min="1" step="1" inputmode="numeric">
                    </div>
                    <div class="field">
                        <label for="minValue">Lower limit</label>
                        <input type="number" id="minValue" value="1" step="1" inputmode="numeric">
                    </div>
                    <div class="field">
                        <label for="rangeValue">Range</label>
                        <input type="number" id="rangeValue" value="1000" min="1" step="1" inputmode="numeric">
                    </div>
                </div>
            </section>

            <section class="group" aria-labelledby="hTree">
                <h2 id="hTree">Pick tree</h2>
                <div class="row3 tree-row">
                    <div class="field">
                        <label for="treeSelect">Root</label>
                        <select id="treeSelect" disabled><option>—</option></select>
                    </div>
                    <div class="field">
                        <label for="startValue">Start value</label>
                        <input type="number" id="startValue" value="1" step="1" inputmode="numeric">
                    </div>
                    <div class="field">
                        <span class="label" id="modeLabel">Pick by</span>
                        <div class="segmented" role="radiogroup" aria-labelledby="modeLabel">
                            <button type="button" role="radio" id="modeStart" aria-checked="true" title="Show the tree that contains the start value">Start</button>
                            <button type="button" role="radio" id="modeRoot" aria-checked="false" title="Keep the selected root">Root</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="group rules" aria-labelledby="hRules">
                <div class="rules-head">
                    <h2 id="hRules">Rules</h2>
                    <h2 id="hAngles">Angles</h2>
                </div>
                <div class="rule-row">
                    <label for="modulus" class="res">mod</label>
                    <input type="number" id="modulus" value="2" min="2" max="12" step="1" inputmode="numeric">
                    <div id="initAngleKnob" class="knob-slot"></div>
                </div>
                <div id="dynamic-grid"></div>
            </section>
        </div>
        <footer class="panel-foot">
            <a href="https://belliavesha.github.io/">by belliavesha</a>
        </footer>
    </aside>

    <main id="stage">
        <canvas id="mainCanvas" tabindex="0" role="img" aria-roledescription="tree view"
                aria-label="Tree drawing. Drag to pan, scroll or pinch to zoom, click a branch to inspect a number."></canvas>
        <div id="labels-container" aria-hidden="true"></div>

        <div id="toolbar" role="toolbar" aria-label="View">
            <button type="button" class="icon-btn hide-touch" id="zoomOutBtn" title="Zoom out (−)" aria-label="Zoom out">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
            <button type="button" class="icon-btn hide-touch" id="zoomInBtn" title="Zoom in (+)" aria-label="Zoom in">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg></button>
            <button type="button" class="icon-btn" id="fitBtn" title="Fit to screen (F)" aria-label="Fit to screen">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5v-4h4M12.5 3.5h4v4M16.5 12.5v4h-4M7.5 16.5h-4v-4"/></svg></button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button type="button" class="icon-btn" id="toggleLabelsBtn" title="Labels (L)" aria-label="Labels" aria-pressed="true">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5h9l4 4.5-4 4.5h-9z"/><circle cx="12" cy="10" r="1"/></svg></button>
            <button type="button" class="icon-btn" id="toggleBgBtn" title="Light background (T)" aria-label="Light background" aria-pressed="false">
                <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" class="fill"/></svg></button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button type="button" class="icon-btn" id="shareBtn" title="Copy link to this tree" aria-label="Copy link to this tree">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2L9.9 5.9M11.5 8.5a3 3 0 0 0-4.2 0l-2.6 2.6a3 3 0 0 0 4.2 4.2l1.2-1.2"/></svg></button>
            <div class="menu-wrap">
                <button type="button" class="icon-btn" id="exportBtn" title="Save image or tree data" aria-label="Save image or tree data" aria-haspopup="dialog" aria-expanded="false" aria-controls="exportPop">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v9M6 8.5l4 4 4-4M4 16.5h12"/></svg></button>
                <div id="exportPop" class="popover export-pop" role="dialog" aria-label="Save" hidden>
                    <div class="pop-row">
                        <label for="expSize">Image size</label>
                        <select id="expSize">
                            <option value="2048">2048 px</option>
                            <option value="4096" selected>4096 px</option>
                            <option value="8192">8192 px</option>
                        </select>
                    </div>
                    <label class="check"><input type="checkbox" id="expLabels" checked> Labels</label>
                    <label class="check"><input type="checkbox" id="expTransparent"> Transparent background</label>
                    <div class="pop-actions">
                        <button type="button" class="btn" id="saveImgBtn">PNG</button>
                        <button type="button" class="btn" id="saveSvgBtn">SVG</button>
                        <button type="button" class="btn" id="saveTreeBtn">Tree data</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="legend" class="legend overlay-card">
            <button type="button" class="legend-toggle" id="legendToggle" aria-expanded="true" aria-controls="legendBody">
                Legend <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3"/></svg>
            </button>
            <div id="legendBody" class="legend-body">
                <ul class="legend-items" aria-label="Show labels for"></ul>
                <div class="ramp" title="Branch colour: value of n, log scale">
                    <span id="rampLo">1</span><i aria-hidden="true"></i><span id="rampHi">—</span>
                </div>
            </div>
        </div>

        <div id="inspector" class="overlay-card inspector" role="dialog" aria-labelledby="inspValue" hidden>
            <div class="insp-head">
                <span class="insp-n">n = <strong id="inspValue"></strong></span>
                <button type="button" class="icon-btn small" id="inspClose" aria-label="Close details">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button>
            </div>
            <div class="insp-rows">
                <button type="button" class="insp-row" id="rowNext" title="Go to the next number">
                    <span class="k">next</span><span class="v" id="inspNext"></span>
                    <span class="k" id="inspResLabel">mod</span><span class="v" id="inspRes"></span>
                    <svg class="row-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
                </button>
                <button type="button" class="insp-row" id="rowDepth" aria-expanded="false" aria-controls="inspTableWrap" title="Show the path to the root">
                    <span class="k">depth</span><span class="v" id="inspDepth"></span>
                    <span class="k">height</span><span class="v" id="inspHeight"></span>
                    <svg class="row-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg>
                </button>
                <button type="button" class="insp-row" id="rowWeight" aria-expanded="false" aria-controls="inspTableWrap" title="Show the children">
                    <span class="k">weight</span><span class="v" id="inspWeight"></span>
                    <span class="k">children</span><span class="v" id="inspKids"></span>
                    <svg class="row-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg>
                </button>
            </div>
            <div class="insp-table-wrap" id="inspTableWrap" hidden>
                <div class="insp-cap">
                    <span id="inspCap"></span>
                    <button type="button" class="icon-btn small" id="inspCollapse" aria-label="Hide the table" title="Hide the table">
                        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 12.5 10 8l4.5 4.5"/></svg></button>
                </div>
                <table class="insp-table" id="inspTable">
                    <thead><tr><th scope="col">depth</th><th scope="col">n</th><th scope="col" id="inspModHead">mod</th><th scope="col">weight</th></tr></thead>
                    <tbody id="inspTbody"></tbody>
                </table>
            </div>
            <div class="insp-actions">
                <button type="button" class="btn" id="inspStart">Set as start</button>
                <button type="button" class="btn" id="inspPathBtn" aria-pressed="true">Path</button>
                <button type="button" class="btn" id="inspCopy">Copy</button>
            </div>
        </div>

        <div id="tooltip" aria-hidden="true" hidden></div>

        <div id="progress" class="overlay-card progress" role="status" hidden>
            <span class="progress-text">Building trees</span>
            <div class="bar"><i id="progressBar"></i></div>
            <span class="pct" id="progressPct">0%</span>
            <button type="button" class="btn" id="cancelBtn">Cancel</button>
        </div>

        <div id="empty" class="empty" hidden>
            <p>No tree to show. Check the rules, or press <strong>Build trees</strong>.</p>
        </div>

        <div id="toasts" aria-live="polite"></div>
        <p id="srStatus" class="sr-only" aria-live="polite"></p>
    </main>
</div>

<input type="file" id="loadTreeFile" accept=".json,application/json" hidden>

<script src="tree_math.js"></script>
<script src="js/state.js"></script>
<script src="js/layout.js"></script>
<script src="js/render.js"></script>
<script src="js/knob.js"></script>
<script src="js/build_core.js"></script>
<script src="js/build.js"></script>
<script src="js/ui.js"></script>
<script src="js/controls.js"></script>
<script src="js/io.js"></script>
<script src="js/inspector.js"></script>
<script src="js/app.js"></script>
</body>
</html>
