<!doctype html>
<html lang="en" data-light="day">
<!-- revontuli · merits: inside the cabin — the flower wallpaper, warmed to the almanac's paper, and the framed certificates -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merits — Vlad Loktev</title>
<meta name="description" content="Certificates and diplomas of Vladislav Loktev, framed on the wall.">
<link rel="icon" href="assets/images/favicon/hedgehog.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="assets/images/favicon/hedgehog-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/images/favicon/hedgehog-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
<style>
:root{
  --wall:#E6DCC8; --ink:#26211C; --ink-2:#5B5046; --berry:#A8323F;
  --walnut:#3B2A1E; --black:#1E1C1A; --birch:#D9C9A6; --mat:#FBF8F1; --plaque:#F1E7D2;
  --light:0;                          /* 0 = daylight, 1 = lamp-lit evening (from the sun over Turku) */
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100svh;font-family:var(--serif);font-optical-sizing:auto;font-variation-settings:"SOFT" 50,"WONK" 0;color:var(--ink);font-size:15.3px;line-height:1.45;overflow-x:hidden;background:var(--wall)}
a{color:inherit}
:focus-visible{outline:2px dashed var(--berry);outline-offset:3.6px;border-radius:2.7px}

/* the wallpaper: the flower tile, repeated both ways, warmed from its cool greys towards the almanac's cream.
   .paper/.room live INSIDE .wall (not fixed to the body) so their height comes from .wall's own,
   content-driven height and the pattern keeps tiling all the way down a tall page — a fixed/body-level
   version only ever covers one viewport's worth and goes flat below the fold. z-index:-1 keeps both
   behind .wall's real (static) content without having to touch that content's stacking at all. */
.paper{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.paper::before{content:"";position:absolute;inset:0;background:url(assets/images/flowers_tiled2.png) 0 0/1036.8px 1036.8px repeat;
  filter:sepia(.45) saturate(.9) brightness(1.1) contrast(.68)}
.paper::after{content:"";position:absolute;inset:0;background:#F1E6D0;mix-blend-mode:screen;opacity:.32}
/* the light in the room: daylight from the window by day, a warm lamp at night (kept mild — no jump in brightness from page to page) */
.room{position:absolute;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:multiply;
  background:radial-gradient(110% 80% at 88% 6%, rgba(240,246,252,calc(.35 * (1 - var(--light)))), transparent 60%),
             radial-gradient(70% 60% at 50% 22%, rgba(255,224,178,calc(.45 * var(--light))), rgba(255,214,160,calc(.22 * var(--light))) 70%),
             radial-gradient(150% 115% at 50% 25%, transparent 45%, rgba(40,24,10,calc(.14 + .22 * var(--light))) 100%)}
.wall{position:relative;min-height:100vh;min-height:100svh;padding:30.6px 18px calc(135px + var(--rv-reserve));overflow-x:clip}

/* the heading: plain text, left of the little window */
.head{display:flex;align-items:center;justify-content:space-between;gap:21.6px 36px;max-width:1008px;margin:0 auto 41.4px}
.words h1{margin:0;font-weight:380;font-size:clamp(43.2px,7vw,77.4px);line-height:.95;letter-spacing:-.015em;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144}
.words p{margin:.45em 0 0;font-style:italic;font-size:clamp(16.2px,1.8vw,19.8px);line-height:1.35;max-width:24em;color:var(--ink-2)}
.words{position:relative}
.words::before{content:"";position:absolute;inset:-23.4px -54px -27px -45px;border-radius:50%;background:radial-gradient(closest-side,rgba(242,234,218,.92),rgba(242,234,218,.7) 60%,rgba(242,234,218,0));z-index:-1;pointer-events:none}
.words h1,.words p{text-shadow:0 0 9px var(--wall),0 0 2.7px var(--wall)}
.peek{flex:none;position:relative;display:block;width:135px;height:106.2px;border:7.2px solid #EFE8DA;border-radius:2px;
  box-shadow:0 0 0 2px #7A5C3C,0 10.8px 18px -7.2px rgba(0,0,0,.5),inset 0 0 10.8px rgba(0,0,0,.25);overflow:hidden;background:#8BB4DB}
.peek canvas{display:block;width:100%;height:100%}
.peek::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3.6px;margin-left:-2px;background:#EFE8DA}
.peek .tag{position:absolute;left:50%;bottom:5.4px;transform:translate(-50%,3.6px);white-space:nowrap;font:500 10.3px "DM Mono",ui-monospace,monospace;padding:3.6px 7.2px;border-radius:899.1px;background:rgba(21,23,25,.86);color:#EEE7D9;opacity:0;transition:opacity .2s,transform .2s;z-index:2}
.peek:hover .tag,.peek:focus-visible .tag{opacity:1;transform:translate(-50%,0)}
@media (max-width:576px){.head{flex-direction:column-reverse;align-items:flex-start;margin-bottom:34.2px}.peek{align-self:flex-end;width:100.8px;height:79.2px;border-width:5.4px;margin-bottom:-9px}}

/* the frames: generated from SITE.merits; each hangs from a nail on a string */
.hang{list-style:none;margin:0 auto;padding:0;max-width:1008px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:63px 36px}
.hang li{position:relative;width:var(--w);margin-top:var(--drop,0)}
.hang li.L{--w:min(387px,100%)} .hang li.M{--w:min(306px,100%)} .hang li.S{--w:min(225px,100%)}
@media (max-width:576px){.hang{gap:55.8px 14.4px}.hang li.L{--w:100%}.hang li.M{--w:100%}.hang li.S{--w:calc(50% - 7.2px)}.hang li{margin-top:0}}
.frame{position:relative;display:block;width:100%;text-decoration:none;transform:rotate(var(--tilt,0deg));transform-origin:50% -34.2px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.frame:hover,.frame:focus-visible{transform:rotate(0deg)}
/* the string: from the nail DOWN to two screw-eyes on the top of the frame — a Λ, never a V */
.string{position:absolute;left:0;top:-36px;width:100%;height:41.4px;overflow:visible;pointer-events:none}
.string line{stroke:#3A2A1C;stroke-width:1.3}
.string .eye{fill:none;stroke:#8A7456;stroke-width:1.2}
.string .nail{fill:url(#nailG)}
.moulding{position:relative;display:block;padding:var(--fw,10.8px);background:var(--fc,var(--walnut));border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 2px 2px 0 rgba(255,255,255,.1),inset -2px -2px 0 rgba(0,0,0,.25),0 16.2px 21.6px -10.8px rgba(15,8,2,.55),0 3.6px 5.4px -2px rgba(15,8,2,.35)}
.frame.birch .moulding{background:var(--birch);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 2px,transparent 2px 8.1px)}
.frame.black .moulding{background:var(--black)}
.frame.gilt .moulding{background:linear-gradient(135deg,#8C6A2E,#C9A457 40%,#8C6A2E 60%,#B9954A)}
.mat{display:grid;place-items:center;background:var(--mat);aspect-ratio:var(--ar,1.35);padding:13%;box-shadow:inset 1px 1px 2.7px rgba(0,0,0,.18)}
.mat img{max-width:100%;max-height:100%;object-fit:contain;display:block;mix-blend-mode:multiply}
.frame:hover .mat,.frame:focus-visible .mat{box-shadow:inset 1px 1px 2.7px rgba(0,0,0,.18),inset 0 0 36px rgba(255,236,190,.35)}
.plaque{display:block;margin:12.6px auto 0;max-width:94%;padding:6.3px 10.8px 7.2px;background:var(--plaque);color:var(--ink);border-radius:2px;text-align:center;box-shadow:0 4.5px 9px -5.4px rgba(0,0,0,.45);font-size:13.5px;line-height:1.3}
.plaque b{display:block;font-weight:560;font-size:14px;font-variation-settings:"SOFT" 100,"WONK" 0}
.plaque span{display:block;font-size:11.7px;color:var(--ink-2);font-style:italic;margin-top:2px}
.plaque .pdf{font-style:normal;font-size:9.9px;letter-spacing:.1em;text-transform:uppercase;color:var(--berry);margin-top:3.6px;font-family:"DM Mono",ui-monospace,monospace}
.frame:hover .plaque .pdf,.frame:focus-visible .plaque .pdf{text-decoration:underline}
.badge{position:absolute;right:-9px;top:-10.8px;z-index:2;width:41.4px;height:41.4px;border-radius:50%;display:grid;place-items:center;background:var(--berry);color:#fff;font-size:9px;line-height:1.05;text-align:center;font-weight:600;transform:rotate(12deg);box-shadow:0 2.7px 5.4px rgba(0,0,0,.35)}

/* the floor: boards and a rag rug (räsymatto), and whoever sleeps on it */
.floor{position:absolute;left:0;right:0;bottom:0;height:108px;background:#8A6A48;background-image:linear-gradient(180deg,rgba(0,0,0,.28),transparent 30%),repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 162px);border-top:8.1px solid #5E4630}
.rug{position:absolute;left:50%;top:27px;width:min(468px,78vw);height:48.6px;transform:translateX(-50%) perspective(270px) rotateX(38deg);
  background:repeating-linear-gradient(90deg,#EFE6D3 0 9px,#B44A3F 9px 14.4px,#EFE6D3 14.4px 27px,#3D4A63 27px 30.6px,#EFE6D3 30.6px 41.4px,#D8A984 41.4px 45px);border-radius:2.7px;box-shadow:0 5.4px 9px rgba(0,0,0,.3)}
/* the hedgehog asleep on the rug: cells (1,1)⇄(1,2) of the shore sheet — slow breaths, z's drawn in */
.sleeper{position:absolute;left:calc(50% + 50.4px);top:5.4px;width:50.4px;height:50.4px;background:url(assets/images/hog_sprites.png) 14.2857% 14.2857%/800% 800% no-repeat;filter:brightness(.95) sepia(.2);animation:snore 2.6s steps(1) infinite}
@keyframes snore{0%{background-position:14.2857% 14.2857%}50%{background-position:28.5714% 14.2857%}}
html.rv-reduced .sleeper{animation:none}
.sleeper[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.frame{transition:none}.sleeper{animation:none}}
</style>
</head>
<body data-page="merits">
<a class="rv-skip" href="#wall">Skip to content</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="nailG" cx="35%" cy="35%" r="65%"><stop offset="0" stop-color="#B4AAA0"/><stop offset="1" stop-color="#3B342D"/></radialGradient></defs></svg>
<main class="wall" id="wall">
  <div class="paper" aria-hidden="true"></div>
  <div class="room" aria-hidden="true"></div>
  <header class="head">
    <div class="words">
      <h1>Merits</h1>
      <p>Pieces of paper my mom would proudly frame and put on the wall.</p>
    </div>
    <a class="peek" id="peek" href="index.html" aria-label="The window: back outside, to the lake"><canvas id="peekC" width="300" height="236" aria-hidden="true"></canvas><span class="tag">to the lake</span></a>
  </header>
  <ul class="hang" id="hang" aria-label="Certificates, each opens its PDF"></ul>
  <div class="floor" aria-hidden="true"><div class="rug"></div><div class="sleeper" id="sleeper"></div></div>
</main>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
/* revontuli · merits. Frames from SITE.merits; the room light and the little window follow the sun over Turku. */
(() => {
'use strict';
const { clamp, smooth, mix, rgba, esc } = RV;
const $ = s => document.querySelector(s);
const Z = 0.9;                                                     // the page is set at 90% (as the CSS): frame widths, drops and strings scale with it
const FRAME = { gilt: ['gilt', 16], walnut: ['', 12], black: ['black', 9], birch: ['birch', 10] };
const AR = { L: 1.5, M: 1.3, S: 1.2 };
const jit = (k, a) => { const x = Math.sin(k * 12.9898 + a * 78.233) * 43758.5453; return x - Math.floor(x); };   // a steady, per-frame wobble
$('#hang').innerHTML = SITE.merits.map((m, k) => {
  const [cls, fw] = FRAME[m.frame] || FRAME.walnut, size = m.size || 'M';
  const tilt = m.tilt != null ? m.tilt : ((jit(k, 1) - 0.5) * 4.2).toFixed(1), drop = size === 'L' ? 0 : Math.round(jit(k, 2) * 36 * Z);
  return `<li class="${size}" style="--drop:${drop}px"><a class="frame ${cls}" style="--tilt:${tilt}deg;--fw:${(fw * Z).toFixed(1)}px;--ar:${m.ar || AR[size]}" href="${SITE.PDF + m.pdf}" target="_blank" rel="noopener">` +
    `<svg class="string" aria-hidden="true"><line x1="50%" y1="3.6" x2="23%" y2="38.7"/><line x1="50%" y1="3.6" x2="77%" y2="38.7"/><circle class="eye" cx="23%" cy="39.2" r="2.2"/><circle class="eye" cx="77%" cy="39.2" r="2.2"/><circle class="nail" cx="50%" cy="3.6" r="3.6"/></svg>` +
    (m.badge ? `<span class="badge" aria-hidden="true">${m.badge}</span>` : '') +
    `<span class="moulding"><span class="mat"><img src="assets/images/logos/${esc(m.logo)}" alt="${esc(m.alt)}" loading="lazy"></span></span>` +
    `<span class="plaque"><b>${esc(m.title)}</b><span>${esc(m.where)} · ${esc(m.when)}</span><span class="pdf">open the pdf</span></span></a></li>`;
}).join('');
function room() {
  const ms = RV.now(), env = RV.env(ms), sun = env.sun, w = env.w;
  document.documentElement.style.setProperty('--light', smooth(4, -6, sun.alt).toFixed(3));
  // the window: sky, far shore, lake — a tiny copy of the scene outside, with its weather
  const c = $('#peekC').getContext('2d'), W = 300, H = 236, HY = 136;
  const sky = RV.skyAt(sun.alt, w.intensity > 0 ? 0.6 : w.sinceEnd < 12 ? 0.35 : 0);
  const g = c.createLinearGradient(0, 0, 0, HY); g.addColorStop(0, rgba(sky[0])); g.addColorStop(.8, rgba(sky[1])); g.addColorStop(1, rgba(sky[2]));
  c.fillStyle = g; c.fillRect(0, 0, W, HY);
  if (sun.alt > -1 && w.intensity === 0) { const x = ((sun.az - 180) / 360 + .5) * W * 2.2 - W * .6, y = HY - (HY - 12) * Math.pow(clamp(sun.alt, 0, 90) / 90, .8); c.fillStyle = 'rgba(255,238,200,.95)'; c.beginPath(); c.arc(x, y, 8, 0, 7); c.fill(); }
  else if (sun.alt < -8) { c.fillStyle = 'rgba(245,240,225,.8)'; for (let i = 0; i < 30; i++) c.fillRect((i * 97) % W, (i * 53) % (HY - 20), 1.4, 1.4); }
  const dark = sun.alt < -7 ? [5, 8, 12] : [29, 43, 39];
  c.fillStyle = rgba(mix(sky[2], dark, .7));
  c.beginPath(); c.moveTo(0, HY); for (let x = 0; x <= W; x += 6) { const h = 8 + 10 * Math.abs(Math.sin(x * 1.7)) + 4 * Math.sin(x / 30); c.lineTo(x, HY - h); c.lineTo(x + 3, HY - h * .5); } c.lineTo(W, HY); c.fill();
  const lake = env.frozen ? mix(sky[2], [236, 240, 243], .5) : mix(sky[1], dark, .45);
  const lg = c.createLinearGradient(0, HY, 0, H); lg.addColorStop(0, rgba(mix(lake, sky[2], .3))); lg.addColorStop(1, rgba(lake));
  c.fillStyle = lg; c.fillRect(0, HY, W, H - HY);
  if (w.raining) { c.strokeStyle = 'rgba(210,220,230,.5)'; c.lineWidth = 1; c.beginPath(); for (let i = 0; i < 70; i++) { const x = (i * 37) % W, y = (i * 71) % H; c.moveTo(x, y); c.lineTo(x - 2, y + 9); } c.stroke(); }
  if (w.snowing) { c.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 60; i++) c.fillRect((i * 43) % W, (i * 67) % H, 2, 2); }
  if (env.win !== 'clear') { c.fillStyle = env.win === 'frost' ? 'rgba(235,242,248,.4)' : 'rgba(240,238,232,.5)'; c.fillRect(0, 0, W, H); }
  $('#sleeper').hidden = RV.opt('hog') === 'off';
}
room(); setInterval(room, 30000); RV.onChange(room);
})();
</script>
</body>
</html>
